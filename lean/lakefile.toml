name = "MeteoLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MeteoLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "MeteoLean"
